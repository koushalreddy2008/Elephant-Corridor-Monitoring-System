<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#ffffff; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Elephant Corridor Monitoring System - Architecture</text>

  <!-- ==================== HARDWARE SUBSYSTEM ==================== -->
  <!-- Box 1: Digital Inputs (Light Blue) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="100" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Digital inputs</text>
    <text x="100" y="65" text-anchor="middle" font-size="14" fill="#334155">Proximity (2 bit)</text>
    <text x="100" y="92" text-anchor="middle" font-size="14" fill="#334155">Direction (2 bit)</text>
    <text x="100" y="119" text-anchor="middle" font-size="14" fill="#334155">Speed (2 bit)</text>
    <text x="100" y="146" text-anchor="middle" font-size="14" fill="#334155">Night flag (1 bit)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="150" x2="315" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Danger-zone logic (Light Yellow/Orange) -->
  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="220" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="110" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Danger-zone logic</text>
    <text x="110" y="72" text-anchor="middle" font-size="14" fill="#334155">PROX = 11 (&lt;= 500 m)</text>
    <text x="110" y="102" text-anchor="middle" font-size="14" fill="#334155">+ direction / night</text>
    <text x="110" y="132" text-anchor="middle" font-size="14" fill="#334155">-&gt; DANGER flag</text>
  </g>

  <!-- Arrows 2 -> Outputs -->
  <!-- To Warning Signals -->
  <line x1="540" y1="120" x2="615" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- To Crossing Counters -->
  <line x1="540" y1="150" x2="615" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- To Status Display -->
  <line x1="540" y1="180" x2="615" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Warning signals (Light Red) -->
  <g transform="translate(620, 50)">
    <rect x="0" y="0" width="340" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="170" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Warning signals</text>
    <text x="170" y="46" text-anchor="middle" font-size="13.5" fill="#334155">WARN LED + SIREN for residents</text>
  </g>

  <!-- Box 4: Crossing counters (Light Green) -->
  <g transform="translate(620, 122)">
    <rect x="0" y="0" width="340" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="170" y="33" text-anchor="middle" font-size="14" fill="#1e293b">Crossing counters (per corridor)</text>
  </g>

  <!-- Box 5: Status display (Light Green) -->
  <g transform="translate(620, 189)">
    <rect x="0" y="0" width="340" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="170" y="33" text-anchor="middle" font-size="14" fill="#1e293b">Status display (location status)</text>
  </g>

  <!-- Divider Section -->
  <text x="500" y="278" text-anchor="middle" font-size="13.5" font-style="italic" fill="#64748b">HARDWARE (Logisim, live)</text>
  <line x1="40" y1="292" x2="960" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="500" y="312" text-anchor="middle" font-size="13.5" font-style="italic" fill="#64748b">SOFTWARE (x86-64 Assembly, historical analysis)</text>

  <!-- ==================== SOFTWARE SUBSYSTEM ==================== -->
  <!-- Box 6: Historical CSV (Light Purple) -->
  <g transform="translate(40, 345)">
    <rect x="0" y="0" width="210" height="95" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="105" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Historical CSV</text>
    <text x="105" y="68" text-anchor="middle" font-size="13.5" fill="#334155">data/elephant_readings.csv</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="250" y1="392" x2="325" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 7: elephant_report.asm (Light Purple) -->
  <g transform="translate(330, 345)">
    <rect x="0" y="0" width="300" height="95" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="150" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">elephant_report.asm</text>
    <text x="150" y="58" text-anchor="middle" font-size="13.5" fill="#334155">parse - count - argmax - average</text>
    <text x="150" y="80" text-anchor="middle" font-size="13.5" fill="#334155">risk level</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="630" y1="392" x2="695" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 8: Conflict report (Light Purple) -->
  <g transform="translate(700, 345)">
    <rect x="0" y="0" width="260" height="95" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Conflict report</text>
    <text x="130" y="58" text-anchor="middle" font-size="13" fill="#334155">corridor, speed, peak hours,</text>
    <text x="130" y="80" text-anchor="middle" font-size="13" fill="#334155">danger entries, risk level</text>
  </g>

  <!-- Footer Note -->
  <text x="500" y="485" text-anchor="middle" font-size="13.5" fill="#475569">Shared threshold: DANGER_DIST_M = 500 m (asm/thresholds.inc = PROX code 11)</text>
</svg>
