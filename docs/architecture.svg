<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sharedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#f8fafc" letter-spacing="1">ELEPHANT CORRIDOR MONITORING SYSTEM</text>
  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">System Architecture: Dual-Tier Live Digital Circuit &amp; Historical Assembly Analytics</text>

  <!-- HARDWARE SUBSYSTEM (TOP / LEFT) -->
  <rect x="40" y="100" width="440" height="420" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="100" width="440" height="40" rx="12" fill="url(#hwGrad)"/>
  <text x="55" y="126" font-size="16" font-weight="bold" fill="#ffffff">1. HARDWARE SUBSYSTEM (Live Digital Logic)</text>
  <text x="460" y="126" text-anchor="end" font-size="12" fill="#bae6fd">Logisim-Evolution</text>

  <!-- Digital Inputs -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">Digital Inputs</text>
    <line x1="10" y1="32" x2="120" y2="32" stroke="#334155"/>
    <text x="15" y="52" font-size="11" fill="#cbd5e1">• Proximity [1..0]</text>
    <text x="15" y="72" font-size="11" fill="#cbd5e1">• Direction [1..0]</text>
    <text x="15" y="92" font-size="11" fill="#cbd5e1">• Speed [1..0]</text>
    <text x="15" y="112" font-size="11" fill="#cbd5e1">• Night Flag [0]</text>
    <text x="15" y="132" font-size="11" fill="#cbd5e1">• Corridor [1..0]</text>
  </g>

  <!-- Combinational Logic -->
  <g transform="translate(230, 160)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="110" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">Decision Logic Gates</text>
    <line x1="10" y1="32" x2="210" y2="32" stroke="#334155"/>
    <text x="15" y="52" font-size="11" fill="#f1f5f9">DANGER = (PROX == 11)</text>
    <text x="15" y="75" font-size="10.5" fill="#f1f5f9">WARN = DANGER + (P10 · D01)</text>
    <text x="15" y="98" font-size="10.5" fill="#f1f5f9">SIREN = DANGER · (D01 + NIGHT)</text>
    <text x="15" y="125" font-size="10.5" fill="#94a3b8">Status: CLEAR/NEAR/ALERT/DANGER</text>
  </g>

  <!-- Hardware Indicators & Counters -->
  <g transform="translate(60, 335)">
    <rect x="0" y="0" width="390" height="160" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="195" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">Hardware Outputs &amp; Crossings Registry</text>
    <line x1="10" y1="32" x2="380" y2="32" stroke="#334155"/>
    
    <!-- LED Indicators -->
    <circle cx="45" cy="60" r="10" fill="#22c55e" filter="url(#shadow)"/>
    <text x="65" y="64" font-size="11" fill="#cbd5e1">SAFE LED</text>
    <circle cx="160" cy="60" r="10" fill="#eab308" filter="url(#shadow)"/>
    <text x="180" y="64" font-size="11" fill="#cbd5e1">WARN LED</text>
    <circle cx="280" cy="60" r="10" fill="#ef4444" filter="url(#shadow)"/>
    <text x="300" y="64" font-size="11" fill="#cbd5e1">DANGER / SIREN</text>

    <!-- Counters -->
    <rect x="25" y="90" width="75" height="50" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="62" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">Counter A</text>
    <text x="62" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">33</text>

    <rect x="115" y="90" width="75" height="50" rx="4" fill="#1e293b" stroke="#0284c7"/>
    <text x="152" y="112" text-anchor="middle" font-size="11" fill="#38bdf8">Counter B</text>
    <text x="152" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#38bdf8">53</text>

    <rect x="205" y="90" width="75" height="50" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="242" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">Counter C</text>
    <text x="242" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">6</text>

    <rect x="295" y="90" width="75" height="50" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="332" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">Counter D</text>
    <text x="332" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">28</text>
  </g>

  <!-- Connectors in HW -->
  <line x1="190" y1="230" x2="230" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="310" x2="340" y2="335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SOFTWARE SUBSYSTEM (RIGHT) -->
  <rect x="520" y="100" width="440" height="420" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="100" width="440" height="40" rx="12" fill="url(#swGrad)"/>
  <text x="535" y="126" font-size="16" font-weight="bold" fill="#ffffff">2. SOFTWARE SUBSYSTEM (Historical Analysis)</text>
  <text x="940" y="126" text-anchor="end" font-size="12" fill="#a7f3d0">x86-64 NASM</text>

  <!-- Input Data -->
  <g transform="translate(540, 160)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">CSV Telemetry Ingestion</text>
    <line x1="10" y1="32" x2="170" y2="32" stroke="#334155"/>
    <text x="15" y="52" font-size="11" fill="#cbd5e1">data/elephant_readings.csv</text>
    <text x="15" y="75" font-size="10.5" fill="#94a3b8">Schema (6 columns):</text>
    <text x="15" y="95" font-size="10" fill="#e2e8f0">• id, corridor (0..3)</text>
    <text x="15" y="113" font-size="10" fill="#e2e8f0">• hour (0..23), speed_kmh</text>
    <text x="15" y="131" font-size="10" fill="#e2e8f0">• distance_m, direction</text>
  </g>

  <!-- Assembly Processing Engine -->
  <g transform="translate(745, 160)">
    <rect x="0" y="0" width="195" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="97" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">asm/elephant_report.asm</text>
    <line x1="10" y1="32" x2="185" y2="32" stroke="#334155"/>
    <text x="15" y="52" font-size="10.5" fill="#cbd5e1">• Linux raw syscalls</text>
    <text x="15" y="72" font-size="10.5" fill="#cbd5e1">• argmax (Peak corridor)</text>
    <text x="15" y="92" font-size="10.5" fill="#cbd5e1">• Kinematics (avg &amp; max)</text>
    <text x="15" y="112" font-size="10.5" fill="#cbd5e1">• Peak period binning</text>
    <text x="15" y="132" font-size="10.5" fill="#cbd5e1">• Risk percentage check</text>
  </g>

  <!-- Report Output -->
  <g transform="translate(540, 335)">
    <rect x="0" y="0" width="400" height="160" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="200" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">Output Conflict Report (out/conflict_report.txt)</text>
    <line x1="10" y1="32" x2="390" y2="32" stroke="#334155"/>
    <text x="15" y="52" font-size="11" fill="#e2e8f0">Readings Analyzed: 120  |  Most Used: Corridor B (53 crossings)</text>
    <text x="15" y="74" font-size="11" fill="#e2e8f0">Speed: Avg = 5.9 km/h, Max = 20 km/h</text>
    <text x="15" y="96" font-size="11" fill="#e2e8f0">Peak Window: 22:00-22:59  |  Peak Period: Evening (18-24h)</text>
    <text x="15" y="118" font-size="11" fill="#e2e8f0">Danger Incursions: 21 (17%) [20 at night]</text>
    <text x="15" y="142" font-size="12" font-weight="bold" fill="#f59e0b">Risk Level: MEDIUM -> Sound night siren, restrict movement</text>
  </g>

  <!-- Connectors in SW -->
  <line x1="720" y1="230" x2="745" y2="230" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="840" y1="310" x2="840" y2="335" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- SHARED CONFIGURATION & MODEL VERIFICATION (BOTTOM) -->
  <rect x="250" y="540" width="500" height="85" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="540" width="500" height="26" rx="10" fill="url(#sharedGrad)"/>
  <text x="500" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SHARED THRESHOLD RULES &amp; INDEPENDENT PYTHON VALIDATION</text>
  
  <text x="270" y="585" font-size="11.5" fill="#fde68a">• Shared Header: <tspan fill="#ffffff" font-weight="bold">asm/thresholds.inc</tspan> (DANGER_DIST_M = 500 m, NIGHT_START_HR = 18)</text>
  <text x="270" y="608" font-size="11.5" fill="#fde68a">• Verification Model: <tspan fill="#ffffff" font-weight="bold">tools/reference.py</tspan> (Automated parity verification via `make check`)</text>

  <!-- Cross-link arrows from Shared Box -->
  <path d="M 350 540 L 350 520" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>
  <path d="M 650 540 L 650 520" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>
</svg>
